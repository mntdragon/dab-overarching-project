services:
  database:
    image: postgres:16-alpine
    env_file:
      - project.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    labels:
      - "traefik.enable=false"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  migrations:
    image: flyway/flyway:10-alpine
    env_file:
      - project.env
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./database-migrations:/flyway/sql
    labels:
      - "traefik.enable=false"
    command: -url=jdbc:postgresql://database:5432/${POSTGRES_DB} -user=${POSTGRES_USER} -password=${POSTGRES_PASSWORD} -connectRetries=60 migrate

  traefik:
    image: traefik:v3.3
    ports:
      - "8080:8080" # Dashboard
      - "8000:8000" # Entrypoint
    volumes:
    # specific syntax for Docker Desktop on Windows
      - //var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:8000"
  lgtm:
    image: grafana/otel-lgtm
    restart: unless-stopped
    ports:
      - "3000:3000"   # Grafana UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - lgtm-data:/data
    labels:
      - "traefik.enable=false"
  server:
    build: server
    restart: unless-stopped
    depends_on:
      - redis
      - database
    volumes:
      - ./server:/app
    env_file:
      - project.env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - OTEL_SERVICE_NAME=server
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_EXPORTER_OTLP_PROTOCOL=${OTEL_EXPORTER_OTLP_PROTOCOL}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.server-router.entrypoints=web"
      - "traefik.http.routers.server-router.rule=PathPrefix(`/api`)"
      - "traefik.http.services.server-service.loadbalancer.server.port=8000"

  client:
    build: client
    restart: unless-stopped
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules # for Windows to not loose track of the container's modules
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.client-router.entrypoints=web"
      - "traefik.http.routers.client-router.rule=PathPrefix(`/`)"
      - "traefik.http.services.client-service.loadbalancer.server.port=4321"

  grader:
    build: grader
    restart: unless-stopped
    volumes:
      - ./grader:/app
    env_file:
      - project.env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - OTEL_SERVICE_NAME=grader
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_EXPORTER_OTLP_PROTOCOL=${OTEL_EXPORTER_OTLP_PROTOCOL}  
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grader-api.rule=PathPrefix(`/grader-api`)"
      - "traefik.http.routers.grader-api.entrypoints=web"
      - "traefik.http.routers.grader-api.middlewares=grader-api-replacepath"
      - "traefik.http.middlewares.grader-api-replacepath.replacePathRegex.regex=^/grader-api(.*)"
      - "traefik.http.middlewares.grader-api-replacepath.replacePathRegex.replacement=/api$1"
      - "traefik.http.services.grader-api.loadbalancer.server.port=8000"

  redis:
    image: redis:7.4.2
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    labels:
      - "traefik.enable=false"
    command: redis-server /usr/local/etc/redis/redis.conf

  inference-api:
    build: inference-api
    restart: unless-stopped
    volumes:
      - ./inference-api:/app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.inference-api-router.entrypoints=web"
      - "traefik.http.routers.inference-api-router.rule=PathPrefix(`/inference-api`)"
      - "traefik.http.services.inference-api-service.loadbalancer.server.port=8000"  
 
volumes:
  postgres-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./postgres-data

  lgtm-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./lgtm-data    